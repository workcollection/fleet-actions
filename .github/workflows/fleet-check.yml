# Fleet hygiene assertions, run in CI instead of discovered weeks later by a scan.
#
# Everything here was previously audited out-of-band by Python on the dev box
# (hygiene.py, secfleet.py audit, the dependabot coverage sweep). That means drift was
# found on a schedule - a repo could sit wrong for a month. Running the same assertions
# as a PR check moves the finding to the moment the drift is introduced.
#
# Advisory by default (`strict: false`) so adopting it cannot redden 60 repos at once.
# Flip a repo to strict once it is clean.
name: Fleet check
#
# FORK GUARD: when the CALLER's event is a pull request whose head lives in another
# repository (a fork), every job below ignores `inputs.runs-on` and runs on
# `ubuntu-latest`. A public consumer would otherwise let anyone execute their branch on a
# fleet self-hosted runner just by opening a PR. GitHub-hosted runners are sandboxed and
# disposable; ours are not. Same-repo PRs and non-PR events keep the requested runner.

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: 'self-hosted'
      strict:
        description: 'Fail the job on findings instead of only reporting them.'
        type: boolean
        required: false
        default: false
      require-license:
        type: boolean
        required: false
        default: true
      require-dependabot:
        type: boolean
        required: false
        default: true
      require-security-scan:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  check:
    name: Fleet hygiene
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Assert fleet conventions
        shell: bash
        run: |
          set -uo pipefail
          findings=0
          note() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; findings=$((findings+1)); }

          echo '## Fleet check' >> "$GITHUB_STEP_SUMMARY"

          if [ '${{ inputs.require-license }}' = 'true' ]; then
            [ -f LICENSE ] || [ -f LICENSE.md ] || [ -f LICENSE.txt ] || note 'missing **LICENSE**'
          fi
          [ -f .editorconfig ]  || note 'missing **.editorconfig**'
          [ -f .gitattributes ] || note 'missing **.gitattributes**'

          if [ '${{ inputs.require-dependabot }}' = 'true' ]; then
            [ -f .github/dependabot.yml ] || [ -f .github/dependabot.yaml ] \
              || note 'missing **.github/dependabot.yml** - no automated dependency updates'
          fi

          if [ '${{ inputs.require-security-scan }}' = 'true' ]; then
            if ! grep -rqls 'fleet-actions/.github/workflows/security-scan.yml' .github/workflows 2>/dev/null \
               && [ ! -f .github/workflows/security-scan.yml ]; then
              note 'no **security scan** workflow wired'
            fi
          fi

          # runs-on drift: 43 fleet repos mixed '[self-hosted, linux]' and bare
          # 'self-hosted' inside the SAME repo. Harmless individually, but it is the
          # tell-tale of copy-paste and it makes runner-group changes miss files.
          if [ -d .github/workflows ]; then
            forms=$(grep -rhoE '^\s*runs-on:.*' .github/workflows 2>/dev/null \
                    | sed -E 's/\s+#.*//; s/^\s*runs-on:\s*//' | sort -u | grep -c . || true)
            [ "${forms:-0}" -gt 1 ] && note "**${forms} different \`runs-on\` forms** in one repo - normalise them"
          fi

          # Fork-PR exposure. `pull_request_target` runs the BASE workflow with a write
          # token and, combined with a checkout of the PR head, hands fork code your
          # secrets — never acceptable. `pull_request` + self-hosted on a PUBLIC repo is
          # the second shape: fork code on a fleet runner (fleet-actions' own reusable
          # workflows guard against it; a repo's own jobs do not).
          if [ -d .github/workflows ]; then
            if grep -rlsE '^\s*pull_request_target:' .github/workflows >/dev/null 2>&1; then
              note "**\`pull_request_target\`** trigger present - runs with a write token; must not check out or execute PR code"
            fi
            if [ '${{ github.event.repository.visibility }}' = 'public' ]; then
              for f in .github/workflows/*.yml .github/workflows/*.yaml; do
                [ -f "$f" ] || continue
                grep -qsE '^\s*pull_request:' "$f" || continue
                grep -qsE '^\s*runs-on:.*self-hosted' "$f" || continue
                grep -qs 'fleet-actions/.github/workflows/' "$f" && continue   # guarded upstream
                note "**$f**: \`pull_request\` on a self-hosted runner in a PUBLIC repo - fork PRs would run on fleet hardware; use ubuntu-latest for PR builds or gate on \`github.event.pull_request.head.repo.full_name == github.repository\`"
              done
            fi
          fi

          if [ "$findings" -eq 0 ]; then
            echo 'All fleet conventions satisfied.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_${findings} finding(s). Advisory unless the caller sets \`strict: true\`._" >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ inputs.strict }}' = 'true' ]; then
            echo "::error::fleet-check: ${findings} finding(s)"; exit 1
          fi
