# This repo's own CI. It exists because a bad commit here breaks CI in ~65 repos at
# once, so nothing reaches the v1 tag without lint + a real execution of every composite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: actionlint + YAML parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every action/workflow as YAML
        run: |
          python3 - <<'PY'
          import sys, glob, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml missing")
          bad = 0
          for p in glob.glob('.github/**/*.yml', recursive=True):
              try:
                  yaml.safe_load(open(p))
                  print(f"ok   {p}")
              except Exception as e:
                  print(f"FAIL {p}: {e}"); bad += 1
          sys.exit(bad)
          PY
      - name: actionlint
        run: |
          V=1.7.12
          B="https://github.com/rhysd/actionlint/releases/download/v${V}"
          curl -sSL -o /tmp/al.tgz "${B}/actionlint_${V}_linux_amd64.tar.gz"
          curl -sSL "${B}/actionlint_${V}_checksums.txt" | grep " actionlint_${V}_linux_amd64.tar.gz$" \
            | sed 's#  .*# /tmp/al.tgz#' | sha256sum -c - >/dev/null
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          # Composite action files are not workflows; actionlint only reads workflows.
          /tmp/actionlint -color

  tools-tests:
    name: Tool tests (runner minter/agent, mari-gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pn-minter label routing, repo allowlist, pn-agent EXTRA_RUN_ARGS
        run: python3 tools/ephemeral-runners/test_minter_labels.py
      - name: pn-agent start gate (load / psi / fallback)
        run: python3 tools/ephemeral-runners/test_agent_gate.py
      - name: n4-ci-gate policy + shadow summary
        run: python3 tools/n4-ci-gate/test_gate_policy.py
      - name: mari-gate scenarios (stub docker)
        run: bash tools/mari-gate/test.sh
      - name: catboy-sign step scripts (version gate, output-set assert, report)
        run: python3 tools/catboy-sign-tests/run_steps.py

  smoke:
    name: Smoke - every composite actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup-python composite
        uses: ./.github/actions/setup-python
      - run: python3 --version

      - name: setup-go composite
        uses: ./.github/actions/setup-go
      - run: go version

      - name: setup-dotnet composite
        uses: ./.github/actions/setup-dotnet
        with: { dotnet-version: '8.0.x' }
      - run: dotnet --version

      - name: setup-buildx composite
        uses: ./.github/actions/setup-buildx
      - run: docker buildx version

      # ubuntu-latest ships PHP 8.3, so this exercises the PROBE fast path.
      - id: php
        name: setup-php composite (probe path)
        uses: ./.github/actions/setup-php
        with: { php-version: '8.3' }
      - name: Assert probe path
        run: |
          php -v
          php -r 'exit(PHP_MAJOR_VERSION === 8 ? 0 : 1);'
          test '${{ steps.php.outputs.path-taken }}' = 'preinstalled' \
            || { echo "::error::expected the probe to hit, got '${{ steps.php.outputs.path-taken }}'"; exit 1; }

  smoke-php-install:
    # The probe path is the easy one. The INSTALL paths (apt-with-retry, then the
    # upstream fallback) are the entire reason this action exists, and they are what
    # runs on the ARC pods that ship no PHP. Ask for a version ubuntu-latest does not
    # have so the probe MUST miss - otherwise the retry logic ships untested and its
    # first real execution is on a runner nobody is watching.
    name: Smoke - setup-php install path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: php
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.2'
          extensions: 'pdo, pdo_mysql, curl'
      - name: Assert an install path ran and produced the requested version
        run: |
          test '${{ steps.php.outputs.path-taken }}' != 'preinstalled' \
            || { echo "::error::probe unexpectedly hit - this case must exercise an install path"; exit 1; }
          echo "install path taken: ${{ steps.php.outputs.path-taken }}"
          php -v
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 2 ? 0 : 1);' \
            || { echo "::error::wrong PHP version after install"; exit 1; }
          php -m | grep -qi '^curl$' || { echo "::error::requested extension curl missing"; exit 1; }

  smoke-db-service:
    # Both network paths of db-service: the hosted runner is a bare host (ephemeral ports), and a
    # docker:cli container on the same daemon stands in for a self-hosted runner container (shared
    # network namespace, default ports). Every engine is checked with a real client from the job.
    name: Smoke - db-service (postgres, mariadb, mysql, redis; host + runner-container path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pg
        uses: ./.github/actions/postgres
      - id: maria
        uses: ./.github/actions/db-service
        with: { engine: mariadb, env-name: MARIA_URL }
      - id: my
        uses: ./.github/actions/db-service
        with: { engine: mysql, env-name: MYSQL_URL }
      - id: redis
        uses: ./.github/actions/db-service
        with: { engine: redis }
      - name: Assert the job reaches every service and the env is set
        env:
          PG_PORT: ${{ steps.pg.outputs.port }}
          MARIA_PORT: ${{ steps.maria.outputs.port }}
          MY_PORT: ${{ steps.my.outputs.port }}
          REDIS_PORT: ${{ steps.redis.outputs.port }}
        run: |
          set -euo pipefail
          test "$REQUIRE_DB_TESTS" = 1
          test "$(psql "$DATABASE_URL" -tAc 'select 1')" = 1
          test "$(mysql -h 127.0.0.1 -P "$MARIA_PORT" -u ci -pci -N -e 'select 1' ci)" = 1
          test "$(mysql -h 127.0.0.1 -P "$MY_PORT" -u ci -pci -N -e 'select 1' ci)" = 1
          exec 3<>"/dev/tcp/127.0.0.1/$REDIS_PORT"; printf 'PING\r\n' >&3; read -r pong <&3; test "${pong%$'\r'}" = +PONG
          test "$REDIS_URL" = "redis://127.0.0.1:$REDIS_PORT"
          test "$(wc -w <<<"$FLEET_DB_NAMES")" = 4
          echo "host path OK: postgres $PG_PORT, mariadb $MARIA_PORT, mysql $MY_PORT, redis $REDIS_PORT"
      - uses: ./.github/actions/db-service
        if: always()
        with: { stop: 'true' }
      - name: Assert stop removed all of them
        run: test -z "$(docker ps -aq --filter label=org.catboy.fleet-db)"
      - name: Runner-container path (and a leftover in the same namespace is replaced)
        run: |
          set -euo pipefail
          t=$(mktemp -d)
          # A long-lived container with the docker CLI stands in for a runner container that runs
          # several jobs one after the other.
          docker run -d --name fake-runner -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.github/actions/db-service:/a:ro" -v "$t:/t" mirror.gcr.io/library/docker:cli sleep 900 >/dev/null
          docker exec fake-runner apk add -q bash coreutils
          job() { : > "$t/env"; : > "$t/out"
            docker exec -e FLEET_DB_NAMES="${FLEET_DB_NAMES:-}" -e DB_ENGINE="$1" -e DB_USER=ci -e DB_PASSWORD=ci -e DB_NAME=ci -e DB_REQUIRE=true \
              -e DB_TIMEOUT_S=90 -e DB_STALE_S=10800 -e GITHUB_ENV=/t/env -e GITHUB_OUTPUT=/t/out fake-runner bash /a/start.sh; }
          job postgres; grep -qx 'port=5432' "$t/out"; first=$(sed -n 's/^name=//p' "$t/out")
          # the "killed" first job never ran stop: the next job must replace its container, not fail on 5432
          job postgres; grep -qx 'port=5432' "$t/out"
          test -z "$(docker ps -aq --filter "name=^${first}$")"
          # one job with two services: starting redis must keep this job's mariadb
          job mariadb; grep -qx 'port=3306' "$t/out"; maria=$(sed -n 's/^name=//p' "$t/out")
          FLEET_DB_NAMES=$maria job redis; grep -qx 'port=6379' "$t/out"
          test -n "$(docker ps -q --filter "name=^${maria}$")"
          docker ps -aq --filter label=org.catboy.fleet-db | xargs -r docker rm -f >/dev/null; docker rm -f fake-runner >/dev/null
          echo "runner-container path OK (postgres twice, mariadb, redis)"

  pvr-self:
    # Dogfood: the same check every consumer will run, against this repo. Advisory,
    # so a finding here (PVR still off, no SECURITY.md yet) reports without blocking.
    name: pvr-check on this repo
    uses: ./.github/workflows/pvr-check.yml
    with:
      runs-on: ubuntu-latest

  # catboy-sign fail-open proof, measured on ubuntu-latest (no CA there by design):
  #   gate 0 — artifact present, no CATBOY_BAO_ADDR → job green, signed=false, gate=0, artifact re-uploaded
  #   gate 5 — artifact name that does not exist → job green, signed=false, gate=5
  sign-fixture:
    name: catboy-sign fixture
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p dist && printf 'not a PE, just a fixture\n' > dist/fixture.txt && echo fixture > dist/fixture.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: catboy-sign-fixture, path: dist, retention-days: 1 }
  sign-gate0:
    name: catboy-sign gate 0 (no CA)
    needs: sign-fixture
    uses: ./.github/workflows/catboy-sign.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with: { artifact-name: catboy-sign-fixture, runs-on: ubuntu-latest, attest: false }
  sign-gate5:
    name: catboy-sign gate 5 (no artifact)
    uses: ./.github/workflows/catboy-sign.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with: { artifact-name: does-not-exist, runs-on: ubuntu-latest, attest: false }
  sign-assert:
    name: catboy-sign outputs
    needs: [sign-gate0, sign-gate5]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "gate0: signed=${{ needs.sign-gate0.outputs.signed }} gate=${{ needs.sign-gate0.outputs.gate }} artifact=${{ needs.sign-gate0.outputs.artifact }}"
          echo "gate5: signed=${{ needs.sign-gate5.outputs.signed }} gate=${{ needs.sign-gate5.outputs.gate }}"
          [ "${{ needs.sign-gate0.outputs.signed }}" = false ] && [ "${{ needs.sign-gate0.outputs.gate }}" = 0 ] && [ "${{ needs.sign-gate0.outputs.artifact }}" = catboy-sign-fixture-signed ]
          [ "${{ needs.sign-gate5.outputs.signed }}" = false ] && [ "${{ needs.sign-gate5.outputs.gate }}" = 5 ]
