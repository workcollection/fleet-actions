# catboy-sign — sign release artifacts with the catboy.systems PKI (plan catboy-pki v2.2 §6.7).
#
# FAIL-OPEN, NEVER SILENT. The job exits 0 on every path; what changes is whether the
# artifact comes back signed. Every unsigned outcome is (a) a ::warning, (b) `signed=false`
# + `gate=<n>` in the outputs and the step summary, (c) POSTed to CatCMDB
# /pki/unsigned-release so a broken CA or runner binding raises a correlator event on the
# first release, not after a quiet quarter. Gates:
#   0 no CA configured on this runner (ubuntu-latest, or a runner without signing identity)
#   1 no release tag (signing is for refs/tags/* only), or the OpenBao login failed
#   2 run certificate not issued or not trusted: no pinned root in this version, the leaf chains
#     to no pinned root, require-production on a staging root, or a CRL is not published
#   3 signing tool/step failed
#   4 signature did not verify — the signature is REMOVED, an unverifiable artifact never ships
#   5 build artifact not available (the caller's upload failed, usually storage quota)
#   6 bad CA routing value on the runner (mount, timestamp CA, runner issuer, login role prefix)
#
# IDENTITY IS TWO-PART (plan §6.7; DEVIATIONS D1 + D10 in polo-nyan/catboy-pki — no k8s in this fleet):
#   repo    → the GitHub OIDC token of THIS run is the ISSUING login (audience
#             https://ca.catboy.systems, OpenBao role sign-<owner> bound to job_workflow_ref =
#             this file at a v2.* TAG — never a branch). Its policy reaches only pair roles of
#             its own repository_id: run-<repository_id>-<runner>.
#   runner  → AppRole (CATBOY_BAO_ROLE_ID + secret_id from CATBOY_BAO_SECRET_ID_FILE or env).
#             It can issue NOTHING; it only proves "which runner" to CatCMDB ensure-repo-issuer,
#             which needs both tokens before it creates rp-<runner>-<owner>-<repo>-<year> + the pair role.
#
# Runner env (non-secret + one login credential, set by CatCMDB RunnerService / the ARC pod spec):
#   CATBOY_BAO_ADDR  CATBOY_RUNNER_ISSUER  CATBOY_BAO_ROLE_ID  CATBOY_BAO_SECRET_ID_FILE (or _SECRET_ID)  CATBOY_TSA_URL
#   CATBOY_PKI_BASE (default http://pki.catboy.systems): CRLs + the timestamp CA cert (checked against the pinned root)
#   CA generation (routing only, so a tag never names a CA; OpenBao policy is the gate):
#   CATBOY_PKI_CODESIGN_MOUNT (default pki-codesign)  CATBOY_TIMESTAMP_CA_NAME (default t1)
#   CATBOY_PKI_ROLE_PREFIX (exactly sign | sign-stg → login role <prefix>-<owner>).
#   Staging R0: pki-stg-codesign / t0 / sign-stg. The ROOT is never taken from the runner: only the
#   PINNED_ROOTS embedded in this file are trusted, one at a time, with no system CA store. The caller picks the runner (runs-on), so
#   routing is NOT trust: OpenBao binds each generation's login role to its own mount (catboy-pki
#   D16), and the HIERARCHY is decided here from PINNED root fingerprints, never from runner env.
#   CATCMDB_URL + CATCMDB_TOKEN_FILE (0600 file, wins) or CATCMDB_TOKEN (scoped: ensure-repo-issuer,
#   certificates/import, pki/unsigned-release). Secrets go to curl as `-H @<(printf ...)`, never argv.
#   CatCMDB gets its own OIDC token with the FIXED audience https://catcmdb.catboy.systems/pki, never the OpenBao one
#
# Consumers pin an exact tag (docs/TAG-PLAN.md). The caller uploads its build output as an
# artifact and passes the name; the signed copy comes back as `<artifact-name>-signed`.
name: catboy-sign

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the build artifact (uploaded by the caller) whose files get signed.'
        type: string
        required: true
      pe-glob:
        description: 'Files to Authenticode-sign (find -name patterns, space separated).'
        type: string
        required: false
        default: '*.exe *.dll *.msi'
      archive-glob:
        description: 'Files that get a detached CMS signature (<file>.p7s).'
        type: string
        required: false
        default: '*.zip *.tar.gz *.tgz *.nupkg'
      runs-on:
        description: 'Runner label(s). Signing needs a fleet runner; ubuntu-latest takes gate 0 by design.'
        type: string
        required: false
        default: 'self-hosted'
      attest:
        description: 'Also produce a GitHub artifact attestation (Sigstore) — independent of the CA.'
        type: boolean
        required: false
        default: true
      strict:
        description: 'Fail the job when the artifact could not be signed (opt-in; default is fail-open).'
        type: boolean
        required: false
        default: false
      require-production:
        description: 'Refuse any signature that does not chain to a pinned PRODUCTION root (a real release). v2.1.x pins only the staging root, so this always refuses there.'
        type: boolean
        required: false
        default: false
    outputs:
      signed:
        description: 'true when every requested file was signed AND verified'
        value: ${{ jobs.sign.outputs.signed }}
      gate:
        description: 'which fail-open gate tripped (empty when signed)'
        value: ${{ jobs.sign.outputs.gate }}
      artifact:
        description: 'name of the artifact that carries the (signed or unsigned) files'
        value: ${{ jobs.sign.outputs.artifact }}
      hierarchy:
        description: 'production | staging, from the pinned root fingerprint (empty when not signed)'
        value: ${{ jobs.sign.outputs.hierarchy }}
      root-fingerprint:
        description: 'SHA-256 of the root the signature chains to (lowercase hex)'
        value: ${{ jobs.sign.outputs.root-fingerprint }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sign:
    name: catboy-sign
    # FORK GUARD (same as every fleet workflow): a fork PR never runs on a fleet runner.
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.report.outputs.signed }}
      gate: ${{ steps.report.outputs.gate }}
      artifact: ${{ steps.report.outputs.artifact }}
      hierarchy: ${{ steps.report.outputs.hierarchy }}
      root-fingerprint: ${{ steps.report.outputs.root-fingerprint }}
    steps:
      - id: fetch
        name: Build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - id: gate0
        name: Gate 0 — is a CA configured on this runner?
        shell: bash
        env:   # expressions never go into shell source: every value arrives as an environment variable
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -uo pipefail
          if [ "$FETCH_OUTCOME" != 'success' ] || [ ! -d dist ]; then
            echo "gate=5" >> "$GITHUB_OUTPUT"; echo "reason=build artifact $ARTIFACT_NAME not available" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${CATBOY_BAO_ADDR:-}" ] || [ -z "${CATBOY_RUNNER_ISSUER:-}" ]; then
            echo "gate=0" >> "$GITHUB_OUTPUT"; echo "reason=no CA configured on runner ${RUNNER_NAME:-?}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for v in "${CATBOY_PKI_CODESIGN_MOUNT:-pki-codesign}" "${CATBOY_TIMESTAMP_CA_NAME:-t1}" "$CATBOY_RUNNER_ISSUER"; do
            # path segments only: curl collapses ../ into another mount (review of #10, verified)
            [[ $v =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "gate=6" >> "$GITHUB_OUTPUT"; echo "reason=bad CA routing value on runner ${RUNNER_NAME:-?}" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          case ${CATBOY_PKI_ROLE_PREFIX:-sign} in sign|sign-stg) ;; *) false ;; esac || { echo "gate=6" >> "$GITHUB_OUTPUT"; echo "reason=bad CATBOY_PKI_ROLE_PREFIX on runner ${RUNNER_NAME:-?}" >> "$GITHUB_OUTPUT"; exit 0; }
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "gate=1" >> "$GITHUB_OUTPUT"; echo "reason=catboy-sign signs release tags only (this run: $GITHUB_REF). The OpenBao login role binds ref refs/tags/*, so a branch or PR build cannot sign." >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          for t in curl jq openssl; do command -v "$t" >/dev/null || { echo "gate=3" >> "$GITHUB_OUTPUT"; echo "reason=missing tool $t" >> "$GITHUB_OUTPUT"; exit 0; }; done
          if ! command -v osslsigncode >/dev/null; then
            (sudo -n apt-get install -y -qq osslsigncode >/dev/null 2>&1 || apt-get install -y -qq osslsigncode >/dev/null 2>&1) || true
            command -v osslsigncode >/dev/null || { echo "gate=3" >> "$GITHUB_OUTPUT"; echo "reason=osslsigncode not installed on runner ${RUNNER_NAME:-?}" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          echo "gate=" >> "$GITHUB_OUTPUT"; echo "reason=" >> "$GITHUB_OUTPUT"

      - id: login
        name: Gate 1 — repo identity (this run's OIDC token → OpenBao) + runner identity (AppRole)
        if: steps.gate0.outputs.gate == ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          CA_OPT=(); if [ -n "${CATBOY_BAO_CACERT_B64:-}" ]; then echo "$CATBOY_BAO_CACERT_B64" | base64 -d > "$RUNNER_TEMP/bao-ca.pem"; CA_OPT=(--cacert "$RUNNER_TEMP/bao-ca.pem"); fi
          printf '%s' "${CA_OPT[*]:-}" > "$RUNNER_TEMP/ca-opt"
          # repo identity = the issuing login. GitHub mints this token only inside THIS job, with this workflow ref.
          OIDC=$(curl -sS -H @<(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://ca.catboy.systems" | jq -er .value)
          echo "::add-mask::$OIDC"
          # secrets reach jq through its environment (one call only) and curl through stdin, never argv
          RESP=$(CB_ROLE="${CATBOY_PKI_ROLE_PREFIX:-sign}-${GITHUB_REPOSITORY_OWNER}" CB_JWT="$OIDC" jq -n '{role:$ENV.CB_ROLE, jwt:$ENV.CB_JWT}' \
            | curl -sS --fail-with-body "${CA_OPT[@]}" -X POST "$CATBOY_BAO_ADDR/v1/auth/jwt-github/login" -H 'Content-Type: application/json' -d @-)
          TOKEN=$(jq -er .auth.client_token <<<"$RESP"); echo "::add-mask::$TOKEN"; echo "BAO_TOKEN=$TOKEN" >> "$GITHUB_ENV"   # revoked in the always-run cleanup
          unset OIDC   # the OpenBao-audience token never leaves this step (it would be an OpenBao login until it expires)
          echo "policies: $(jq -c .auth.token_policies <<<"$RESP")"
          # runner identity: proves "which runner" for ensure-repo-issuer only; missing = lazy creation impossible, not a failure here
          SID=${CATBOY_BAO_SECRET_ID:-}; [ -n "${CATBOY_BAO_SECRET_ID_FILE:-}" ] && [ -r "$CATBOY_BAO_SECRET_ID_FILE" ] && SID=$(cat "$CATBOY_BAO_SECRET_ID_FILE")
          if [ -n "${CATBOY_BAO_ROLE_ID:-}" ] && [ -n "$SID" ]; then
            RT=$(CB_R="$CATBOY_BAO_ROLE_ID" CB_S="$SID" jq -n '{role_id:$ENV.CB_R, secret_id:$ENV.CB_S}' \
              | curl -sS --fail-with-body "${CA_OPT[@]}" -X POST "$CATBOY_BAO_ADDR/v1/auth/approle/login" -H 'Content-Type: application/json' -d @- \
              | jq -er .auth.client_token) || RT=
            if [ -n "$RT" ]; then echo "::add-mask::$RT"; else echo "::warning::runner AppRole login failed — existing pair roles still work, new ones cannot be created"; fi
          else RT=; echo "::notice::no runner AppRole on this runner — existing pair roles still work"; fi
          unset SID
          CT=${CATCMDB_TOKEN:-}; if [ -n "${CATCMDB_TOKEN_FILE:-}" ] && [ -r "$CATCMDB_TOKEN_FILE" ]; then CT=$(<"$CATCMDB_TOKEN_FILE"); fi; [ -z "$CT" ] || echo "::add-mask::$CT"   # file wins, like the secret_id
          if [ -n "$RT" ] && [ -n "${CATCMDB_URL:-}" ] && [ -n "$CT" ]; then
            # lazy: creates the repo issuer + pair role once (needs BOTH identities), no-op afterwards.
            # CatCMDB gets its OWN OIDC token (fixed audience), so it can never replay it
            # as an OpenBao login; both tokens stay inside this step.
            YEAR=$(date -u +%Y); OWNER=${GITHUB_REPOSITORY_OWNER}; REPO=${GITHUB_REPOSITORY#*/}
            CJWT=$(curl -sS -H @<(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://catcmdb.catboy.systems/pki" | jq -er .value) && echo "::add-mask::$CJWT"
            jq -n --arg issuer "rp-${CATBOY_RUNNER_ISSUER}-${OWNER}-${REPO}-${YEAR}" --arg runner "$CATBOY_RUNNER_ISSUER" --arg owner "$OWNER" --arg repo "$REPO" \
                  --argjson rid "$GITHUB_REPOSITORY_ID" --argjson year "$YEAR" '{issuer:$issuer, runner:$runner, owner:$owner, repo:$repo, repository_id:$rid, year:$year}' \
              | curl -sS -m 30 -o /dev/null -w 'ensure-repo-issuer: %{http_code}\n' -X POST "$CATCMDB_URL/api/v1/pki/ensure-repo-issuer" \
                  -H @<(printf 'Authorization: Bearer %s\nX-Bao-Token: %s\nX-GitHub-OIDC: %s\n' "$CT" "$RT" "${CJWT:-}") -H 'Content-Type: application/json' -d @- || true
            unset CJWT
          fi
          unset CT
          # the runner token was only an identity proof: revoke it now
          if [ -n "$RT" ]; then curl -sS -o /dev/null "${CA_OPT[@]}" -X POST -H @<(printf 'X-Vault-Token: %s\n' "$RT") "$CATBOY_BAO_ADDR/v1/auth/token/revoke-self" || true; fi
          unset RT

      - id: cert
        name: Gate 2 — repo identity + 1-hour run certificate
        if: steps.gate0.outputs.gate == '' && steps.login.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          REQUIRE_PRODUCTION: ${{ inputs.require-production }}
          # PINNED TRUST ANCHORS, embedded: "<hierarchy> <base64 of the root certificate DER>" per line.
          # Each is trusted ALONE (one cert per CAfile, -no-CApath -no-CAstore), so no bundle, runner
          # env or system store can add an anchor. Changing this list is a new, reviewed tag
          # (orchestrator ruling 2026-09-26): v2.1.x pins the staging root R0 after its ceremony;
          # v2.2.0 adds the production root R1 at the R1 ceremony.
          # staging: "Marc Schneider Root CA R0 (Staging)", DER SHA-256 ed5eaa1b7a66e154e8c82a3d45f65ddd36a3fbbad1f41a68d2bf4334ccc2d375,
          #          valid until 2028-03-27; ceremony 2026-09-26 (polo-nyan/catboy-pki, docs/STAGING-R0.md). Every
          #          signature under it reports hierarchy=staging; require-production refuses it.
          PINNED_ROOTS: |
            staging 
        run: |
          set -euo pipefail
          umask 077
          read -r -a CA_OPT < "$RUNNER_TEMP/ca-opt" || true
          YEAR=$(date -u +%Y); OWNER=${GITHUB_REPOSITORY_OWNER}; REPO=${GITHUB_REPOSITORY#*/}
          ROLE="run-${GITHUB_REPOSITORY_ID}-${CATBOY_RUNNER_ISSUER}"        # D10: keyed by the immutable repository id
          ISSUER="rp-${CATBOY_RUNNER_ISSUER}-${OWNER}-${REPO}-${YEAR}"
          # pins first: no key or certificate is minted when nothing could ever verify (review of #10, B)
          rm -rf "$RUNNER_TEMP/pins"; mkdir -p "$RUNNER_TEMP/pins"; n=0; prod=0
          while read -r h b64; do
            [ -n "${h:-}" ] || continue
            case $h in production|staging) ;; *) echo "reason=bad pinned hierarchy '$h'" >> "$GITHUB_OUTPUT"; exit 1 ;; esac
            n=$((n+1)); [ "$h" = production ] && prod=1
            base64 -d <<<"$b64" | openssl x509 -inform DER -out "$RUNNER_TEMP/pins/$n.$h.pem"
          done <<<"$PINNED_ROOTS"
          if [ "$n" = 0 ]; then echo "reason=no pinned root in this catboy-sign version (nothing is issued)" >> "$GITHUB_OUTPUT"; echo "::error::no pinned catboy root"; exit 1; fi
          if [ "$REQUIRE_PRODUCTION" = true ] && [ "$prod" = 0 ]; then echo "reason=require-production: this catboy-sign version pins no production root (nothing is issued)" >> "$GITHUB_OUTPUT"; echo "::error::require-production: no production root pinned"; exit 1; fi
          # D1/D10: issue through the PAIR ROLE with the OIDC-login token; its policy reaches only run-<own repository_id>-*
          curl -sS --fail-with-body "${CA_OPT[@]}" -X POST "$CATBOY_BAO_ADDR/v1/${CATBOY_PKI_CODESIGN_MOUNT:-pki-codesign}/issue/$ROLE" \
            -H @<(printf 'X-Vault-Token: %s\n' "$BAO_TOKEN") -H 'Content-Type: application/json' \
            -d "$(jq -n --arg cn "$GITHUB_REPOSITORY" --arg uris "https://github.com/$GITHUB_REPOSITORY,https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                  '{common_name:$cn, ttl:"1h", uri_sans:$uris, private_key_format:"pkcs8"}')" \
            > "$RUNNER_TEMP/cert.json"
          jq -er .data.certificate "$RUNNER_TEMP/cert.json" > "$RUNNER_TEMP/sign.crt"
          jq -er .data.private_key "$RUNNER_TEMP/cert.json" > "$RUNNER_TEMP/sign.key"
          # exactly ONE leaf, and it must belong to the key we hold: a replayed public leaf followed by
          # another cert could otherwise put a misleading hierarchy/fingerprint into CatCMDB (review of #10)
          [ "$(grep -c -- '-----BEGIN CERTIFICATE-----' "$RUNNER_TEMP/sign.crt")" = 1 ] || { echo "reason=run certificate response holds more than one certificate" >> "$GITHUB_OUTPUT"; exit 1; }
          [ "$(openssl x509 -in "$RUNNER_TEMP/sign.crt" -noout -pubkey | openssl pkey -pubin -outform DER | sha256sum)" = \
            "$(openssl pkey -in "$RUNNER_TEMP/sign.key" -pubout -outform DER | sha256sum)" ] || { echo "reason=run certificate does not match the issued key" >> "$GITHUB_OUTPUT"; exit 1; }
          jq -er '.data.ca_chain[]' "$RUNNER_TEMP/cert.json" > "$RUNNER_TEMP/chain.pem"
          SERIAL=$(jq -er .data.serial_number "$RUNNER_TEMP/cert.json"); echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"
          # the anchor is the ONE pinned root the leaf verifies to; each pin is tried alone, never the system store
          HIER=""; for f in "$RUNNER_TEMP"/pins/*.pem; do
            if openssl verify -no-CApath -no-CAstore -CAfile "$f" -untrusted "$RUNNER_TEMP/chain.pem" "$RUNNER_TEMP/sign.crt" >/dev/null 2>&1; then
              cp "$f" "$RUNNER_TEMP/root.crt"; HIER=${f##*/}; HIER=${HIER#*.}; HIER=${HIER%.pem}; break
            fi
          done
          if [ -z "$HIER" ]; then echo "reason=the run certificate chains to no pinned root (serial $SERIAL)" >> "$GITHUB_OUTPUT"; echo "::error::no pinned root verifies the run certificate"; exit 1; fi
          RFP=$(openssl x509 -in "$RUNNER_TEMP/root.crt" -outform DER | sha256sum | cut -c1-64)
          { echo "root-fingerprint=$RFP"; echo "hierarchy=$HIER"; } >> "$GITHUB_OUTPUT"
          if [ "$REQUIRE_PRODUCTION" = true ] && [ "$HIER" != production ]; then echo "reason=require-production: this run chains to the $HIER root (serial $SERIAL)" >> "$GITHUB_OUTPUT"; echo "::error::require-production: $HIER signature refused"; exit 1; fi
          # HARD GATE (catboy-pki G-CRL): every CRL a verifier will fetch must already be published.
          # Fetch each chain cert's CDP plus the TSA chain (timestamp CA cert + CRL) and STOP with a named
          # reason if any is missing — osslsigncode hard-fails on an unreachable CDP, and a signed
          # artifact whose CRL is missing would fail verification everywhere.
          : > "$RUNNER_TEMP/crls.pem"; missing=""
          csplit -s -z -f "$RUNNER_TEMP/c-" "$RUNNER_TEMP/chain.pem" '/BEGIN CERTIFICATE/' '{*}' || true
          for f in "$RUNNER_TEMP"/sign.crt "$RUNNER_TEMP"/c-*; do
            subj=$(openssl x509 -in "$f" -noout -subject | sed 's/^subject=//')
            urls=$(openssl x509 -in "$f" -noout -ext crlDistributionPoints 2>/dev/null | grep -o 'URI:[^ ,]*' | cut -c5-)
            for url in $urls; do
              if curl -sS -m 15 --fail "$url" -o "$RUNNER_TEMP/one.crl" 2>/dev/null \
                 && { openssl crl -in "$RUNNER_TEMP/one.crl" -inform DER -outform PEM 2>/dev/null || openssl crl -in "$RUNNER_TEMP/one.crl" -outform PEM 2>/dev/null; } >> "$RUNNER_TEMP/crls.pem"; then :
              else missing="$missing [$subj] $url"; fi
            done
          done
          PKI=${CATBOY_PKI_BASE:-http://pki.catboy.systems}
          if [ -n "${CATBOY_TSA_URL:-}" ]; then
            TSCA=${CATBOY_TIMESTAMP_CA_NAME:-t1}
            curl -sS -m 15 --fail "$PKI/certs/$TSCA.crt" -o "$RUNNER_TEMP/tsca.crt" 2>/dev/null || missing="$missing [timestamp CA cert] $PKI/certs/$TSCA.crt"
            curl -sS -m 15 --fail "$PKI/crl/$TSCA.crl"  -o "$RUNNER_TEMP/tsca.crl" 2>/dev/null || missing="$missing [timestamp CA CRL] $PKI/crl/$TSCA.crl"
            # fetched over http: it becomes a TSA anchor only if it chains to the pinned root
            if [ -s "$RUNNER_TEMP/tsca.crt" ]; then
              if openssl verify -no-CApath -no-CAstore -CAfile "$RUNNER_TEMP/root.crt" -untrusted "$RUNNER_TEMP/chain.pem" "$RUNNER_TEMP/tsca.crt" >/dev/null 2>&1; then
                cat "$RUNNER_TEMP/root.crt" "$RUNNER_TEMP/tsca.crt" > "$RUNNER_TEMP/tsa-anchors.pem"
              else missing="$missing [timestamp CA does not chain to the pinned root] $PKI/certs/$TSCA.crt"; fi
            fi
          fi
          if [ -n "$missing" ]; then echo "reason=CRL not published for:$missing" >> "$GITHUB_OUTPUT"; echo "::error::CRL not published for:$missing"; exit 1; fi
          # mirror the leaf into CatCMDB so revocation-by-run is a lookup, not an enumeration
          CT=${CATCMDB_TOKEN:-}; if [ -n "${CATCMDB_TOKEN_FILE:-}" ] && [ -r "$CATCMDB_TOKEN_FILE" ]; then CT=$(<"$CATCMDB_TOKEN_FILE"); fi; [ -z "$CT" ] || echo "::add-mask::$CT"   # file wins, like the secret_id
          if [ -n "${CATCMDB_URL:-}" ] && [ -n "$CT" ]; then
            jq -n --arg cert "$(cat "$RUNNER_TEMP/sign.crt")" --arg chain "$(cat "$RUNNER_TEMP/chain.pem")" --arg issuer "$ISSUER" \
                  --arg runner "$CATBOY_RUNNER_ISSUER" --arg run_id "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg wf "${GITHUB_WORKFLOW_REF:-}" \
                  --arg hier "$HIER" --arg rfp "$RFP" \
                  '{certificate:$cert, chain:$chain, issuer:$issuer, runner:$runner, run_id:$run_id, sha:$sha, ref:$ref, job_workflow_ref:$wf, hierarchy:$hier, root_fingerprint:$rfp}' \
              | curl -sS -m 30 -o /dev/null -w 'certificates/import: %{http_code}\n' -X POST "$CATCMDB_URL/api/v1/certificates/import" \
                  -H @<(printf 'Authorization: Bearer %s\n' "$CT") -H 'Content-Type: application/json' -d @- || true
          fi
          unset CT
          echo "issued $SERIAL from $ISSUER via role $ROLE"

      - id: sign
        name: Gate 3/4 — Authenticode + CMS, verified, unverifiable signatures removed
        if: steps.gate0.outputs.gate == '' && steps.cert.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          LEAF_SERIAL: ${{ steps.cert.outputs.serial }}
          HIERARCHY: ${{ steps.cert.outputs.hierarchy }}
          ROOT_FP: ${{ steps.cert.outputs.root-fingerprint }}
          PE_GLOB: ${{ inputs.pe-glob }}
          ARCHIVE_GLOB: ${{ inputs.archive-glob }}
        run: |
          set -uo pipefail
          fail=0; signed=0; removed=0
          TS=(); [ -n "${CATBOY_TSA_URL:-}" ] && TS=(-ts "$CATBOY_TSA_URL") || echo "::warning::CATBOY_TSA_URL unset — signatures carry no timestamp and expire with the 1-hour leaf"
          CRL=(); [ -s "$RUNNER_TEMP/crls.pem" ] && CRL=(-CRLfile "$RUNNER_TEMP/crls.pem")
          TSAV=(); [ -s "$RUNNER_TEMP/tsa-anchors.pem" ] && TSAV=(-TSA-CAfile "$RUNNER_TEMP/tsa-anchors.pem" -TSA-CRLfile "$RUNNER_TEMP/tsca.crl")
          v=$(osslsigncode --version 2>&1 | grep -oE '[0-9]+\.[0-9]+' | head -1); [ "$(printf '%s\n2.13\n' "$v" | sort -V | head -1)" = "2.13" ] || echo "::warning::osslsigncode $v < 2.13 on this runner (memory-safety fixes); the runner image should carry >= 2.13"
          cat "$RUNNER_TEMP/sign.crt" "$RUNNER_TEMP/chain.pem" > "$RUNNER_TEMP/signchain.pem"
          { echo "# Signatures"; echo; echo "Signed by catboy.systems PKI (**$HIERARCHY** hierarchy, root SHA-256 \`$ROOT_FP\`) for \`$GITHUB_REPOSITORY\` run $GITHUB_RUN_ID (leaf serial $LEAF_SERIAL)."; echo; echo '| file | sha256 | signature |'; echo '|---|---|---|'; } > dist/SIGNATURES.md
          # shellcheck disable=SC2086
          find_args() { local first=1; for p in $1; do [ $first = 1 ] || printf ' -o'; printf ' -name %q' "$p"; first=0; done; }
          while IFS= read -r -d '' f; do
            if osslsigncode sign -certs "$RUNNER_TEMP/signchain.pem" -key "$RUNNER_TEMP/sign.key" -h sha256 -n "$GITHUB_REPOSITORY" "${TS[@]}" -in "$f" -out "$f.signed" >/dev/null 2>&1 && mv "$f.signed" "$f"; then
              if osslsigncode verify -CAfile "$RUNNER_TEMP/root.crt" "${CRL[@]}" "${TSAV[@]}" -in "$f" >/dev/null 2>&1; then
                signed=$((signed+1)); echo "| \`${f#dist/}\` | $(sha256sum "$f" | cut -c1-64) | Authenticode |" >> dist/SIGNATURES.md
              else
                osslsigncode remove-signature -in "$f" -out "$f.u" >/dev/null 2>&1 && mv "$f.u" "$f"; removed=$((removed+1)); echo "::warning::unverifiable signature removed: $f"
              fi
            else rm -f "$f.signed"; fail=$((fail+1)); echo "::warning::sign failed: $f"; fi
          done < <(eval find dist -type f \\\( "$(find_args "$PE_GLOB")" \\\) -print0)
          while IFS= read -r -d '' f; do
            if openssl cms -sign -binary -in "$f" -signer "$RUNNER_TEMP/sign.crt" -inkey "$RUNNER_TEMP/sign.key" -certfile "$RUNNER_TEMP/chain.pem" -outform DER -out "$f.p7s" 2>/dev/null \
               && openssl cms -verify -binary -content "$f" -in "$f.p7s" -inform DER -no-CApath -no-CAstore -CAfile "$RUNNER_TEMP/root.crt" -purpose any -out /dev/null 2>/dev/null; then
              signed=$((signed+1)); echo "| \`${f#dist/}\` | $(sha256sum "$f" | cut -c1-64) | CMS detached \`${f##*/}.p7s\` |" >> dist/SIGNATURES.md
            else rm -f "$f.p7s"; fail=$((fail+1)); echo "::warning::CMS sign/verify failed: $f"; fi
          done < <(eval find dist -type f \\\( "$(find_args "$ARCHIVE_GLOB")" \\\) -print0)
          echo "signed=$signed failed=$fail removed=$removed"
          echo "counts=$signed/$fail/$removed" >> "$GITHUB_OUTPUT"
          [ $removed = 0 ] || { echo "gate=4" >> "$GITHUB_OUTPUT"; exit 1; }
          [ $fail = 0 ] || { echo "gate=3" >> "$GITHUB_OUTPUT"; exit 1; }

      - name: Shred the run key
        if: always()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/sign.key" ] && (shred -u "$RUNNER_TEMP/sign.key" 2>/dev/null || rm -f "$RUNNER_TEMP/sign.key"); rm -f "$RUNNER_TEMP/cert.json"
          if [ -n "${BAO_TOKEN:-}" ] && [ -n "${CATBOY_BAO_ADDR:-}" ]; then
            read -r -a CA_OPT < "$RUNNER_TEMP/ca-opt" 2>/dev/null || CA_OPT=()
            curl -sS -o /dev/null -w 'revoke OpenBao token: %{http_code}\n' "${CA_OPT[@]}" -X POST -H @<(printf 'X-Vault-Token: %s\n' "$BAO_TOKEN") "$CATBOY_BAO_ADDR/v1/auth/token/revoke-self" || true
          fi
          true

      - id: attest
        name: GitHub artifact attestation (independent of the CA)
        if: inputs.attest && steps.gate0.outputs.gate != '5' && hashFiles('dist/**') != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'

      - id: upload
        name: Upload the (signed) artifact
        if: steps.gate0.outputs.gate != '5'
        continue-on-error: true   # artifact quota must not fail the job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}-signed
          path: dist
          retention-days: 7

      - id: report
        name: Report (fail-open is not silent)
        if: always()
        shell: bash
        env:
          G0_GATE: ${{ steps.gate0.outputs.gate }}
          G0_REASON: ${{ steps.gate0.outputs.reason }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          CERT_OUTCOME: ${{ steps.cert.outcome }}
          CERT_REASON: ${{ steps.cert.outputs.reason }}
          CERT_SERIAL: ${{ steps.cert.outputs.serial }}
          HIERARCHY: ${{ steps.cert.outputs.hierarchy }}
          ROOT_FP: ${{ steps.cert.outputs.root-fingerprint }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          SIGN_GATE: ${{ steps.sign.outputs.gate }}
          SIGN_COUNTS: ${{ steps.sign.outputs.counts }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          STRICT: ${{ inputs.strict }}
        run: |
          set -uo pipefail
          gate=$G0_GATE; reason=$G0_REASON
          if [ -z "$gate" ]; then
            if [ "$LOGIN_OUTCOME" != 'success' ]; then gate=1; reason='OpenBao login with the run OIDC token failed (role <prefix>-<owner>: tagged fleet workflow and a release-tag ref required)'
            elif [ "$CERT_OUTCOME" != 'success' ]; then gate=2; reason=${CERT_REASON:-'run certificate not issued'}
            elif [ "$SIGN_OUTCOME" != 'success' ]; then gate=${SIGN_GATE:-3}; reason="signing failed (signed/failed/removed: $SIGN_COUNTS)"
            fi
          fi
          art=$ARTIFACT_NAME; [ "$UPLOAD_OUTCOME" = 'success' ] && art="${art}-signed"
          echo "artifact=$art" >> "$GITHUB_OUTPUT"
          if [ -z "$gate" ]; then
            { echo "signed=true"; echo "gate="; echo "hierarchy=$HIERARCHY"; echo "root-fingerprint=$ROOT_FP"; } >> "$GITHUB_OUTPUT"
            { echo "## catboy-sign: signed ✅ ($HIERARCHY)"; echo; echo "hierarchy **$HIERARCHY**, root SHA-256 \`$ROOT_FP\`"; echo; echo "runner issuer \`rn-${CATBOY_RUNNER_ISSUER:-?}\`, leaf serial \`$CERT_SERIAL\`, files signed/failed/removed: \`$SIGN_COUNTS\`"; echo; echo 'Verify: https://pki.catboy.systems/verify'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"; echo "gate=$gate" >> "$GITHUB_OUTPUT"
            echo "::warning::release NOT signed by catboy.systems (gate $gate: $reason)"
            { echo "## catboy-sign: NOT signed ⚠️ (gate $gate)"; echo; echo "$reason"; echo; echo 'The release ships unsigned but attested; the event is recorded in CatCMDB.'; } >> "$GITHUB_STEP_SUMMARY"
            CT=${CATCMDB_TOKEN:-}; if [ -n "${CATCMDB_TOKEN_FILE:-}" ] && [ -r "$CATCMDB_TOKEN_FILE" ]; then CT=$(<"$CATCMDB_TOKEN_FILE"); fi; [ -z "$CT" ] || echo "::add-mask::$CT"   # file wins, like the secret_id
            # CatCMDB binds `repo` to the verified claims of its own-audience OIDC token (best effort:
            # a caller without id-token: write still reports, CatCMDB treats the header as optional for now)
            CJWT=""
            if [ -n "$CT" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              CJWT=$(curl -sS -m 15 -H @<(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://catcmdb.catboy.systems/pki" | jq -er .value) || CJWT=""
              [ -z "$CJWT" ] || echo "::add-mask::$CJWT"
            fi
            if [ -n "${CATCMDB_URL:-}" ] && [ -n "$CT" ]; then
              jq -n --arg repo "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" --arg gate "$gate" --arg reason "$reason" --arg runner "${RUNNER_NAME:-}" --arg wf "${GITHUB_WORKFLOW_REF:-}" --arg serial "${CERT_SERIAL:-}" \
                 '{repo:$repo, run_id:$run_id, gate:($gate|tonumber), reason:$reason, runner:$runner, job_workflow_ref:$wf, serial:$serial}' \
                | curl -sS -m 20 -o /dev/null -w 'unsigned-release: %{http_code}\n' -X POST "$CATCMDB_URL/api/v1/pki/unsigned-release" \
                    -H @<(printf 'Authorization: Bearer %s\n' "$CT"; [ -z "$CJWT" ] || printf 'X-GitHub-OIDC: %s\n' "$CJWT") -H 'Content-Type: application/json' -d @- || true
            fi
            unset CT CJWT
            if [ "$STRICT" = 'true' ]; then echo "::error::strict mode: unsigned release refused (gate $gate)"; exit 1; fi
          fi
